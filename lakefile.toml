name = "lean4lean"
defaultTargets = ["Lean4Lean.Research"]

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.35.0"

[[lean_lib]]
name = "Lean4Lean"

[[lean_lib]]
name = "Lean4Lean.Theory"
globs = ["Lean4Lean.Theory.*"]

[[lean_lib]]
name = "Lean4Lean.Verify"
globs = ["Lean4Lean.Verify.*"]

[[lean_lib]]
name = "Lean4Lean.Tests"
globs = ["Lean4Lean.Tests.*"]

[[lean_lib]]
name = "Lean4Lean.Experimental"
globs = ["Lean4Lean.Experimental.+"]

[[lean_exe]]
name = "lean4lean"
root = "Main"
supportInterpreter = true

# Reviewed research suite; see research/README.md for the validation boundary.
[[lean_lib]]
name = "Lean4Lean.Research"
globs = ["Lean4Lean.Research.+"]
